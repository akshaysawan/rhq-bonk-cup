<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHQ Bonk Cup Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="https://trackmania.io/img/medals/author.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header id="main-header" class="site-header">
        <div class="container">
            <div class="header-content">
                
                <div class="title-group">
                    <h1 class="header-title">RHQ BONK CUP <span class="accent">ARCHIVE</span></h1>
                    <p class="header-subtitle">Weekly Trackmania Campaigns & Winners</p>
                </div>

                <div class="header-actions">
                    <button onclick="pickRandomCup()" class="random-btn">
                        <i class="fas fa-dice"></i> Random Cup
                    </button>
                </div>

                <div class="header-divider"></div>

                <div class="header-stats">
                    <div class="stat-item">
                        <div id="stat-total-cups" class="stat-value">0</div>
                        <div class="stat-label">Total Cups</div>
                    </div>
                    <div class="stat-item">
                        <div id="stat-unique-winners" class="stat-value">0</div>
                        <div class="stat-label">Unique Winners</div>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <div id="header-spacer"></div>

    <div class="container main-wrapper">
        
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="openTab('campaigns-tab')">
                <i class="fas fa-list"></i> Campaigns
            </button>
            <button class="tab-btn" onclick="openTab('maps-tab')">
                <i class="fas fa-map"></i> Maps
            </button>
            <button class="tab-btn" onclick="openTab('stats-tab')">
                <i class="fas fa-chart-bar"></i> Statistics
            </button>
        </div>

        <div id="campaigns-tab" class="tab-content active">
            <div class="search-filter-wrapper">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search for Map Name, Author, Winner, or Cup #...">
                </div>
                <div class="sort-container">
                    <label for="cup-sort-select"><i class="fas fa-sort"></i> Sort:</label>
                    <select id="cup-sort-select">
                        <option value="edition-desc">Edition (Newest First)</option>
                        <option value="edition-asc">Edition (Oldest First)</option>
                        <option value="maps-desc">Most Maps</option>
                        <option value="time-desc">Longest Campaign Time</option>
                    </select>
                </div>
            </div>

            <div id="cup-list" class="accordion-section">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading Data...</p>
                </div>
            </div>
        </div>

        <div id="maps-tab" class="tab-content" style="display:none;">
            <div class="search-filter-wrapper">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="map-search-input" placeholder="Search map name, author, or cup edition...">
                </div>
                <div class="sort-container">
                    <label for="map-sort-select"><i class="fas fa-sort"></i> Sort Maps:</label>
                    <select id="map-sort-select">
                        <option value="edition-desc">Edition (Newest First)</option>
                        <option value="time-asc">Author Time (Fastest)</option>
                        <option value="time-desc">Author Time (Slowest)</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="author-asc">Author (A-Z)</option>
                    </select>
                </div>
            </div>
            <div class="maps-header-bar">
                <div id="maps-counter" class="results-counter">Showing 0 maps</div>
                <div class="page-size-container">
                    <label for="map-page-size-select"><i class="fas fa-layer-group"></i> Per Page:</label>
                    <select id="map-page-size-select">
                        <option value="36">36</option>
                        <option value="72" selected>72</option>
                        <option value="144">144</option>
                        <option value="all">All</option>
                    </select>
                </div>
            </div>
            <div id="map-grid" class="map-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading Maps...</p>
                </div>
            </div>
            <div id="maps-pagination" class="pagination-controls"></div>
        </div>

        <div id="stats-tab" class="tab-content" style="display:none;">
            
            <div class="filter-bar">
                <label for="year-filter"><i class="fas fa-calendar-alt"></i> Filter by Year:</label>
                <select id="year-filter">
                    <option value="all">All Time</option>
                </select>
            </div>

            <div class="charts-grid">
                <div class="chart-card full-width">
                    <h3>🏆 Most Wins</h3>
                    <div class="chart-wrapper">
                        <canvas id="winsChart"></canvas>
                    </div>
                </div>

                <div class="chart-card full-width">
                    <h3>🏗️ Top Mappers</h3>
                    <div class="chart-wrapper">
                        <canvas id="mappersChart"></canvas>
                    </div>
                </div>

                <div class="trivia-card full-width">
                    <h3 style="margin:0; border:none; color:var(--accent-color); font-size:1.5rem;">
                        <i class="fas fa-bolt"></i> RHQ Hall of Fame & Badges
                    </h3>
                    <div id="trivia-content"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Player Profile Modal -->
    <div id="player-modal" class="modal-overlay" onclick="closePlayerModalOnBackdrop(event)">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closePlayerModal()" title="Close"><i class="fas fa-times"></i></button>
            <div id="modal-content">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>© RHQ Bonk Cup Archive - by Reaper94s · Data from <a href="https://trackmania.io" target="_blank">Trackmania.io</a></p>
    </footer>
    <button id="back-to-top" title="Back to Top"><i class="fas fa-arrow-up"></i></button>
    <script src="script.js"></script>
</body>
</html>
